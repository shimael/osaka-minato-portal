<style>

<script src="meibo-data.js"></script>
<script>
  let VIEW="table", SORT="role";
  let MEMBERS=[], KEY={};                 /* KEY = 実列名の解決結果 */
  let ROLEORDER={}, ROLEORDER_KEN={};
  let HELD_AT=null;
  let PHOTO_IDS=new Set();
  const STORE_KEY="rinri-meibo-cache-v2";
  document.getElementById("orgName").textContent=CONFIG.ORG_NAME;
  document.getElementById("subTitle").textContent=CONFIG.SUBTITLE;

  const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const norm=s=>(s||"").replace(/\s|　/g,"");

  function resolveKeys(row){
    const keys=Object.keys(row||{});
    const fold=s=>String(s||"").replace(/\s|　|\n|\r/g,"");
    const out={};
    for(const f in FIELD){
      const cands=FIELD[f];
      let hit=cands.find(c=>keys.includes(c));
      if(!hit){
        const folded=keys.map(k=>({k, f:fold(k)}));
        hit=(cands.map(c=>folded.find(x=>x.f===fold(c))).find(Boolean)||{}).k;
      }
      out[f]=hit||cands[0];
    }
    if(!keys.includes(out.roleKen)){
      const ken=keys.find(k=>/研究所|辞令/.test(k) && /役職/.test(k));
      if(ken) out.roleKen=ken;
    }
    return out;
  }
  const get=(m,f)=>m[KEY[f]];

  function joinYears(j){ if(!j) return null;
    const m=String(j).match(/(\d{4})[\/\-.年]?\s*(\d{1,2})?/); if(!m) return null;
    const y=+m[1], mo=m[2]?+m[2]:1, now=new Date(); let e=now.getFullYear()-y;
    if(now.getMonth()+1<mo) e-=1; return e<0?null:e+1; }
  function joinKey(j){ const m=String(j||"").match(/(\d{4})[\/\-.年]?\s*(\d{1,2})?/); return m?(+m[1])*100+(m[2]?+m[2]:0):999999; }
  function parseBirth(b){
    const m=String(b||"").match(/(\d{4})[\/\-.年]\s*(\d{1,2})[\/\-.月]\s*(\d{1,2})/);
    return m?{y:+m[1], mo:+m[2], d:+m[3]}:null;
  }
  function birthKey(b){ const p=parseBirth(b); return p?p.mo*100+p.d:9999; }
  function fmtBirth(b){ const p=parseBirth(b); return p?`${p.mo}月${p.d}日`:(String(b||"").trim()||"—"); }
  function ageOf(b){
    const p=parseBirth(b); if(!p) return null;
    const now=new Date();
    let a=now.getFullYear()-p.y;
    if((now.getMonth()+1)*100+now.getDate() < p.mo*100+p.d) a-=1;
    return a>=0?a:null;
  }
  function fmtBirthExtra(b){
    const p=parseBirth(b); if(!p) return "";
    const a=ageOf(b);
    return `${p.y}年生まれ`+(a!=null?`・${a}歳`:"");
  }
  function birthCell(b){
    const extra=fmtBirthExtra(b);
    return extra?`${esc(fmtBirth(b))}<span class="birth-extra">${esc(extra)}</span>`:esc(fmtBirth(b));
  }
  function photoURL(v, id){
    v=(v||"").trim();
    if(v){
      const m=v.match(/https?:\/\/[^\s"'<>)]+/i);
      if(m) return m[0];
      if(/\.(jpe?g|png|webp|gif)$/i.test(v)) return (CONFIG.PHOTO_BASE_URL||"")+v.replace(/^photos\//,"");
    }
    const n=String(id||"").trim();
    if(n && PHOTO_IDS.has(n)) return (CONFIG.PHOTO_BASE_URL||"")+n+".jpg";
    return null;
  }
  const AVC=["#3a6ea5","#c8632b","#2e8b6b","#8b5cf6","#b03a5b","#0f7f9e","#a06a1b","#5c6bc0"];
  function avColor(n){let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return AVC[h%AVC.length];}
  function firstChar(n){return (n||"？").replace(/\s|　/g,"").charAt(0);}

  /* 設定 → 単会は G/H列、研究所辞令は I/J列 */
  function parseSettei(rows){
    ROLEORDER={}; ROLEORDER_KEN={};
    (rows||[]).forEach(r=>{
      const a=(r[6]||"").trim(), ao=(r[7]||"").trim();
      if(a && /^\d+$/.test(ao) && !a.includes("役職リスト")) ROLEORDER[a]=+ao;
      const b=(r[8]||"").trim(), bo=(r[9]||"").trim();
      if(b && /^\d+$/.test(bo) && !b.includes("役職リスト")) ROLEORDER_KEN[b]=+bo;
    });
  }
  function roleOrderOf(role, map){
    map=map||ROLEORDER;
    if(!role) return 999;
    if(map[role]!=null) return map[role];
    const base=role.replace(/（.*?）|\(.*?\)/g,"").trim();
    return map[base]!=null?map[base]:900;
  }

  /* チームの色はチーム名の五十音順に割り当てる（同じ名簿なら毎回同じ色） */
  const TEAM_COLORS=[
    {c:"#2f6fb0",bg:"#eaf2fb",bd:"#bcd4ee"},{c:"#c0592a",bg:"#fcefe8",bd:"#f0c8b4"},
    {c:"#23866a",bg:"#e6f5f0",bd:"#b3dfd1"},{c:"#7b52d6",bg:"#f1ecfc",bd:"#d3c4f3"},
    {c:"#b23a62",bg:"#fbeaf0",bd:"#efbfd0"},{c:"#0d7f99",bg:"#e5f4f8",bd:"#b0dce7"},
    {c:"#9a6a12",bg:"#faf1df",bd:"#ead1a0"},{c:"#4c5bb8",bg:"#ebedfa",bd:"#c3c9ee"}
  ];
  let TEAMS=[];
  function teamStyle(t){
    const i=TEAMS.indexOf(t); if(i<0) return "";
    const p=TEAM_COLORS[i%TEAM_COLORS.length];
    return `--team:${p.c};--team-bg:${p.bg};--team-bd:${p.bd}`;
  }
  const TEAM_ICON=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.4-.2 4.1 1.4 4.6 4.3"/></svg>`;
  function teamChip(m){
    return m._team?`<span class="team-chip" style="${teamStyle(m._team)}" title="チーム">${TEAM_ICON}${esc(m._team)}</span>`:"";
  }

  function decorate(){
    MEMBERS.forEach(m=>{
      m._role=(get(m,"role")||"").trim();
      m._roleKen=(get(m,"roleKen")||"").trim();
      m._ro=roleOrderOf(m._role, ROLEORDER);
      m._roKen=roleOrderOf(m._roleKen, ROLEORDER_KEN);
      m._team=(get(m,"team")||"").trim();
      m._committee=(get(m,"committee")||"").trim();
      m._status=(get(m,"status")||"").trim();
      const ti=TEAMS.indexOf(m._team);
      m._teamOrder=ti<0?999:ti;
    });
  }
  function fillTeamSelect(){
    const sel=document.getElementById("teamSel"), cur=sel.value;
    const hasNone=MEMBERS.some(m=>!(get(m,"team")||"").trim());
    sel.innerHTML=`<option value="">すべてのチーム</option>`
      +TEAMS.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("")
      +(TEAMS.length&&hasNone?`<option value="__none">チームなし</option>`:"");
    sel.value=[...sel.options].some(o=>o.value===cur)?cur:"";
    sel.style.display=TEAMS.length?"":"none";
  }
  function shownRole(m){ return SORT==="roleKen" ? m._roleKen : m._role; }
  function sortRows(rows){ const a=[...rows];
    if(SORT==="joined") a.sort((x,y)=>joinKey(get(x,"joined"))-joinKey(get(y,"joined")) || norm(get(x,"kana")).localeCompare(norm(get(y,"kana")),'ja'));
    else if(SORT==="birth") a.sort((x,y)=>birthKey(get(x,"birth"))-birthKey(get(y,"birth")));
    else if(SORT==="kana") a.sort((x,y)=>(get(x,"kana")||"").localeCompare(get(y,"kana")||"",'ja'));
    else if(SORT==="roleKen") a.sort((x,y)=>(x._roKen-y._roKen) || joinKey(get(x,"joined"))-joinKey(get(y,"joined")));
    else if(SORT==="role") a.sort((x,y)=>(x._ro-y._ro) || joinKey(get(x,"joined"))-joinKey(get(y,"joined")));
    else if(SORT==="team") a.sort((x,y)=>(x._teamOrder-y._teamOrder) || (x._ro-y._ro) || joinKey(get(x,"joined"))-joinKey(get(y,"joined")));
    return a; }
  function filterRows(){ const q=(document.getElementById("q").value||"").trim().toLowerCase(); let rows=MEMBERS;
    const team=document.getElementById("teamSel").value;
    if(team==="__none") rows=rows.filter(m=>!m._team);
    else if(team) rows=rows.filter(m=>m._team===team);
    if(q) rows=rows.filter(m=>[get(m,"name"),get(m,"kana"),get(m,"company"),get(m,"referrer"),m._role,m._roleKen,m._team,m._committee].map(v=>String(v||"")).join(" ").toLowerCase().includes(q));
    return sortRows(rows); }
  function statusBadge(m){
    return m._status && m._status!=="在籍" ? `<span class="status-badge">${esc(m._status)}</span>` : "";
  }

  function memAvatar(m,cls){ const p=photoURL(get(m,"photo"), get(m,"id")); const name=get(m,"name")||"";
    return p?`<img class="${cls}" src="${esc(p)}" alt="" onerror="this.outerHTML='<div class=\\'${cls}\\' style=\\'background:${avColor(name)}\\'>${esc(firstChar(name))}</div>'">`
            :`<div class="${cls}" style="background:${avColor(name)}">${esc(firstChar(name))}</div>`; }

  function renderCards(rows){ if(!rows.length) return `<div class="empty">該当する会員が見つかりません</div>`;
    return `<div class="cards">`+rows.map(m=>{ const yrs=joinYears(get(m,"joined"));
      const head=(shownRole(m)?`<span class="role-badge">${esc(shownRole(m))}</span>`:"")+statusBadge(m);
      const tags=(yrs?`<span class="years">入会 ${yrs}年目</span>`:"")+teamChip(m);
      return `<div class="mcard" style="${teamStyle(m._team)}">${memAvatar(m,"avatar")}<div class="info">
        ${head?head+"<br>":""}
        <p class="kana">${esc(get(m,"kana")||"")}</p>
        <h3 class="name">${esc(get(m,"name")||"")}</h3>
        <div class="meta"><b>会社</b><span>${esc(get(m,"company")||"—")}</span><b>誕生日</b><span>${birthCell(get(m,"birth"))}</span><b>紹介者</b><span>${esc(get(m,"referrer")||"—")}</span>${m._committee?`<b>委員会</b><span>${esc(m._committee)}</span>`:""}</div>
        ${tags?`<div class="tags">${tags}</div>`:""}
      </div></div>`; }).join("")+`</div>`; }
  function th(label,key){ const on=SORT===key; return `<th class="${on?'sorted':''}" onclick="setSort('${key}')">${label}<span class="ar">${on?'▲':'⇅'}</span></th>`; }
  function renderTable(rows){ if(!rows.length) return `<div class="empty">該当する会員が見つかりません</div>`;
    const body=rows.map(m=>{ const yrs=joinYears(get(m,"joined"));
      return `<tr><td>${memAvatar(m,"t-avatar")}</td>
        <td><div class="t-name">${esc(get(m,"name")||"")}</div><div class="t-kana">${esc(get(m,"kana")||"")}${statusBadge(m)}</div></td>
        <td class="t-role">${esc(shownRole(m)||"—")}</td>
        <td>${teamChip(m)||'<span class="t-small">—</span>'}${m._committee?`<span class="t-committee">${esc(m._committee)}</span>`:""}</td>
        <td>${birthCell(get(m,"birth"))}</td>
        <td>${esc(get(m,"joined")||"—")}<span class="t-years"> ${yrs?'('+yrs+'年目)':''}</span></td>
        <td class="t-small">${esc(get(m,"company")||"—")}</td>
        <td class="t-small">${esc(get(m,"referrer")||"—")}</td></tr>`; }).join("");
    const roleHead=SORT==="roleKen"?"役職（研究所辞令）":"役職（単会）";
    const roleKey=SORT==="roleKen"?"roleKen":"role";
    return `<div class="table-wrap"><table><thead><tr><th></th>${th('氏名 / 読み仮名','kana')}${th(roleHead,roleKey)}${th('チーム / 委員会','team')}${th('誕生日','birth')}${th('入会','joined')}<th>会社名</th><th>紹介者</th></tr></thead><tbody>${body}</tbody></table></div>`; }

  function draw(){ decorate(); const rows=filterRows();
    document.getElementById("app").innerHTML = VIEW==="card"?renderCards(rows):renderTable(rows);
    document.getElementById("count").textContent=`${rows.length}名`; }
  function setView(v){ VIEW=v; document.getElementById("btnCard").classList.toggle("active",v==="card"); document.getElementById("btnTable").classList.toggle("active",v==="table"); draw(); }
  function setSort(k){ SORT=k; document.getElementById("sortSel").value=k; draw(); }
  document.getElementById("q").addEventListener("input",draw);
  document.getElementById("sortSel").addEventListener("change",e=>{SORT=e.target.value;draw();});
  document.getElementById("teamSel").addEventListener("change",draw);

  function parseCSV(text){
    const rows=[]; let row=[], cell="", q=false;
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(q){
        if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
        else cell+=c;
      } else if(c==='"') q=true;
      else if(c===","){ row.push(cell); cell=""; }
      else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else if(c!=="\r") cell+=c;
    }
    if(cell!==""||row.length){ row.push(cell); rows.push(row); }
    return rows.filter(r=>r.some(v=>(v||"").trim()));
  }
  function rowsToObjects(rows){
    if(!rows.length) return [];
    const keys=rows[0];
    return rows.slice(1).map(r=>{
      const o={}; keys.forEach((k,i)=>o[k]=r[i]||""); return o;
    });
  }
  async function fetchText(url, ms=25000){
    if(!url) return null;
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(), ms);
    try{
      const res=await fetch(url, {cache:"no-store", signal:ctrl.signal});
      if(!res.ok) return null;
      const text=await res.text();
      if(!text || text.trim().startsWith("<")) return null;
      return text;
    }catch(e){ return null; }
    finally{ clearTimeout(t); }
  }
  async function loadCsv(url, header){
    const text=await fetchText(url);
    if(!text) return null;
    const rows=parseCSV(text);
    return header ? rowsToObjects(rows) : rows;
  }

  function readLocal(){
    try{
      const d=JSON.parse(localStorage.getItem(STORE_KEY)||"null");
      if(d && d.koukai && d.koukai.length) return d;
    }catch(e){}
    return null;
  }
  function saveHeld(pack){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(pack)); }catch(e){}
  }
  function newerPack(a,b){
    if(!a) return b;
    if(!b) return a;
    const ta=Date.parse(a.fetchedAt||"")||0;
    const tb=Date.parse(b.fetchedAt||"")||0;
    return tb>ta ? b : a;
  }
  function fmtFetched(iso){
    if(!iso) return "取得日 不明";
    const d=new Date(iso);
    if(isNaN(d)) return "取得日 "+String(iso).slice(0,10);
    return `取得日 ${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  }
  function daysSince(iso){
    const t=Date.parse(iso||"");
    if(!t) return 999;
    return Math.floor((Date.now()-t)/86400000);
  }
  function renderFetchMeta(){
    const age=daysSince(HELD_AT);
    const stale=age>=7;
    document.getElementById("fetchedAt").textContent=fmtFetched(HELD_AT);
    document.getElementById("staleNote").textContent=stale?"1週間以上前です。変わっていれば「更新」を押してください。":"";
    document.getElementById("btnRefresh").classList.toggle("stale", stale);
  }
  function applyPack(pack){
    const p=pack||{};
    MEMBERS=(p.koukai&&p.koukai.length)?p.koukai:SAMPLE_KOUKAI;
    KEY=resolveKeys(MEMBERS[0]||{});
    MEMBERS=MEMBERS.filter(m=>get(m,"name") && !HIDDEN_STATUS.test((get(m,"status")||"").trim()));
    TEAMS=[...new Set(MEMBERS.map(m=>(get(m,"team")||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    fillTeamSelect();
    parseSettei((p.settei&&p.settei.length)?p.settei:SAMPLE_SETTEI);
    HELD_AT=p.fetchedAt||null;
    document.getElementById("sortSel").value=SORT;
    draw();
    renderFetchMeta();
  }
  async function refreshFromSheet(){
    const btn=document.getElementById("btnRefresh");
    const msg=document.getElementById("refreshMsg");
    btn.disabled=true; btn.textContent="取得中…"; msg.textContent="";
    const [koukai, settei]=await Promise.all([
      loadCsv(CONFIG.KOUKAI_CSV_URL, true),
      loadCsv(CONFIG.SETTEI_CSV_URL, false)
    ]);
    if(!koukai || !koukai.length){
      msg.textContent="シートに届きませんでした。今の名簿のままです。";
      msg.style.color="#a33";
      btn.disabled=false; btn.textContent="更新";
      return;
    }
    const pack={ fetchedAt:new Date().toISOString(), koukai, settei:settei||[] };
    saveHeld(pack);
    applyPack(pack);
    msg.style.color="#2b6a4a";
    msg.textContent="最新のシートを取り込みました。";
    btn.disabled=false; btn.textContent="更新";
  }

  async function loadPhotoManifest(){
    try{
      const r=await fetch("photos/manifest.json?_="+Date.now(), {cache:"no-store"});
      if(!r.ok) return;
      const j=await r.json();
      PHOTO_IDS=new Set((j.ids||[]).map(v=>String(v)));
    }catch(e){}
  }
  async function boot(){
    await loadPhotoManifest();
    applyPack(newerPack(window.MEIBO_SNAPSHOT||null, readLocal()));
  }
  document.getElementById("btnRefresh").addEventListener("click", refreshFromSheet);
  boot();
</script>
</body>
